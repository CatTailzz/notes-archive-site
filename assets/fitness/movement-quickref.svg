<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1608" viewBox="0 0 1120 1608" fill="none">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 20; }
      .title { font: 700 28px 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #102a43; }
      .hint { font: 500 16px 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #486581; }
      .line { stroke: #243b53; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .lite { stroke: #829ab1; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .accent { stroke: #ef4444; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dash { stroke: #9fb3c8; stroke-width: 4; stroke-dasharray: 10 8; stroke-linecap: round; fill: none; }
      .text { font: 700 18px 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #334e68; }
      .small { font: 600 14px 'PingFang SC', 'Noto Sans SC', sans-serif; fill: #627d98; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10" fill="none" stroke="#ef4444" stroke-width="2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="1608"/>

  <!-- Row 1 -->
  <rect class="panel" x="40" y="40" width="500" height="280"/>
  <text class="title" x="70" y="88">门框拉胸</text>
  <text class="hint" x="70" y="118">胸微微前送，肩别耸</text>
  <path class="lite" d="M150 150V255M380 150V255"/>
  <circle class="line" cx="265" cy="152" r="20"/>
  <path class="line" d="M265 172V230M265 198L180 188M265 198L350 188M265 230L236 258M265 230L294 258"/>
  <path class="accent" d="M265 214H315" marker-end="url(#arrow)"/>

  <rect class="panel" x="580" y="40" width="500" height="280"/>
  <text class="title" x="610" y="88">靠墙天使</text>
  <text class="hint" x="610" y="118">背贴墙，手臂慢慢上滑</text>
  <path class="lite" d="M965 140V255"/>
  <circle class="line" cx="835" cy="154" r="20"/>
  <path class="line" d="M835 174V235M835 194L780 208M835 194L890 208M835 235L808 258M835 235L862 258"/>
  <path class="dash" d="M780 208L772 160M890 208L898 160"/>
  <path class="accent" d="M770 210L760 170M900 210L910 170" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect class="panel" x="40" y="352" width="500" height="280"/>
  <text class="title" x="70" y="400">猫牛式</text>
  <text class="hint" x="70" y="430">呼气拱背，吸气塌背</text>
  <circle class="line" cx="170" cy="492" r="18"/>
  <path class="line" d="M188 496C235 458 280 458 325 500M220 516L205 548M286 516L300 548M164 510L146 542"/>
  <text class="small" x="132" y="578">猫</text>
  <circle class="line" cx="392" cy="492" r="18"/>
  <path class="line" d="M410 496C452 540 498 540 535 500M442 510L430 548M510 510L522 548M388 510L370 542"/>
  <text class="small" x="356" y="578">牛</text>
  <path class="accent" d="M252 470H334" marker-end="url(#arrow)"/>

  <rect class="panel" x="580" y="352" width="500" height="280"/>
  <text class="title" x="610" y="400">死虫</text>
  <text class="hint" x="610" y="430">对侧手脚慢慢伸</text>
  <circle class="line" cx="724" cy="500" r="18"/>
  <path class="line" d="M742 500H838M790 500L770 438M790 500L834 446M790 500L760 548M790 500L860 548"/>
  <path class="accent" d="M770 438L760 414M860 548L888 570" marker-end="url(#arrow)"/>
  <path class="dash" d="M834 446L852 422M760 548L732 570"/>

  <!-- Row 3 -->
  <rect class="panel" x="40" y="664" width="500" height="280"/>
  <text class="title" x="70" y="712">平板支撑</text>
  <text class="hint" x="70" y="742">身体一条线，别塌腰</text>
  <path class="lite" d="M118 860H452"/>
  <circle class="line" cx="188" cy="804" r="16"/>
  <path class="line" d="M204 804L286 794L390 794L430 850M286 794L258 846"/>
  <path class="accent" d="M286 770H382" marker-end="url(#arrow)"/>

  <rect class="panel" x="580" y="664" width="500" height="280"/>
  <text class="title" x="610" y="712">卷腹</text>
  <text class="hint" x="610" y="742">小幅卷起肩胛，别拽脖子</text>
  <path class="lite" d="M632 860H1026"/>
  <circle class="line" cx="732" cy="808" r="16"/>
  <path class="line" d="M748 808C785 804 806 790 830 760M760 820L824 820M824 820L874 848M824 820L874 792"/>
  <path class="dash" d="M748 808H828"/>
  <path class="accent" d="M760 792C786 780 808 772 826 754" marker-end="url(#arrow)"/>

  <!-- Row 4 -->
  <rect class="panel" x="40" y="976" width="500" height="280"/>
  <text class="title" x="70" y="1024">高位俯卧撑</text>
  <text class="hint" x="70" y="1054">手撑高台，身体成直线</text>
  <path class="lite" d="M142 1205H448"/>
  <path class="lite" d="M150 1118H260V1205"/>
  <circle class="line" cx="310" cy="1096" r="16"/>
  <path class="line" d="M326 1096L272 1126L220 1126L380 1205"/>
  <path class="accent" d="M314 1070L290 1050" marker-end="url(#arrow)"/>

  <rect class="panel" x="580" y="976" width="500" height="280"/>
  <text class="title" x="610" y="1024">Y-T-W</text>
  <text class="hint" x="610" y="1054">肩下沉，别耸</text>
  <circle class="line" cx="698" cy="1150" r="14"/>
  <path class="line" d="M698 1164V1208M698 1178L668 1140M698 1178L728 1140"/>
  <text class="text" x="684" y="1238">Y</text>
  <circle class="line" cx="830" cy="1150" r="14"/>
  <path class="line" d="M830 1164V1208M830 1178L790 1178M830 1178L870 1178"/>
  <text class="text" x="816" y="1238">T</text>
  <circle class="line" cx="962" cy="1150" r="14"/>
  <path class="line" d="M962 1164V1208M962 1178L930 1154M962 1178L994 1154"/>
  <text class="text" x="944" y="1238">W</text>

  <!-- Row 5 -->
  <rect class="panel" x="40" y="1288" width="500" height="280"/>
  <text class="title" x="70" y="1336">婴儿式</text>
  <text class="hint" x="70" y="1366">臀部坐回，双手前伸</text>
  <path class="lite" d="M120 1492H448"/>
  <circle class="line" cx="274" cy="1456" r="16"/>
  <path class="line" d="M290 1456C320 1444 344 1444 376 1454M274 1472C246 1478 224 1478 196 1490M196 1490C220 1490 250 1490 284 1490"/>
  <path class="dash" d="M376 1454L418 1464"/>

  <rect class="panel" x="580" y="1288" width="500" height="280"/>
  <text class="title" x="610" y="1336">颈部轻拉伸</text>
  <text class="hint" x="610" y="1366">轻轻侧屈，不要硬扯</text>
  <circle class="line" cx="824" cy="1428" r="34"/>
  <path class="line" d="M824 1462V1528M824 1490L782 1516M824 1490L866 1516"/>
  <path class="accent" d="M846 1410C862 1400 872 1388 876 1374" marker-end="url(#arrow)"/>
  <path class="dash" d="M824 1394V1370"/>
</svg>
